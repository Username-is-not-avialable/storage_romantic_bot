name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API — pytest
    runs-on: ubuntu-latest
    env:
      # API config requires DB_* at import time (see api/config.py).
      # Tests run against in-memory SQLite and override get_db, so these
      # values only need to be present, not reachable.
      DB_HOST: localhost
      DB_USER: ci_user
      DB_PASSWORD: ci_pass
      DB_NAME: ci_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # same as api/dockerfile
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt
      - name: Run tests
        run: python -m pytest api/tests -q

  api-compile:
    name: API/bot/scripts — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Byte-compile
        run: python -m compileall -q api bot scripts

  web-lint:
    name: Web — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  web-build:
    name: Web — build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f api/dockerfile -t storage/api .
      - name: Build web image
        run: docker build -f web/Dockerfile -t storage/web ./web
      - name: Build bot image
        run: docker build -f bot/Dockerfile -t storage/bot ./bot