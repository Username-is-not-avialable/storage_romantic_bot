services:
  db:
    image: postgres:15-alpine
    container_name: storage_db
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-storage_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-storage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/dockerfile
    container_name: storage_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-storage_db}
    # Прямой доступ к API с хоста (отладка). Для продакшена достаточно доступа из сети compose через `web`.
    ports:
      - "8100:8000"
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: storage_web
    depends_on:
      - api
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:80"
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: storage_bot
    depends_on:
      - api
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_BOT_SECRET: ${VK_BOT_SECRET:-}
      VK_LINK_PAGE_URL: ${VK_LINK_PAGE_URL:-}
    volumes:
      - ./bot/bot:/app/bot
    restart: unless-stopped

volumes:
  postgres_data: