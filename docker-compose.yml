services:
  db:
    image: postgres:15-alpine
    container_name: storage_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-storage_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-storage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/dockerfile
    container_name: storage_api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-storage_db}
    # Прямой доступ к API с хоста (отладка). Для продакшена достаточно доступа из сети compose через `web`.
    ports:
      - "8100:8000"
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: storage_web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: storage_bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_BOT_SECRET: ${VK_BOT_SECRET:-}
      VK_LINK_PAGE_URL: ${VK_LINK_PAGE_URL:-}
    volumes:
      - ./bot/bot:/app/bot
    restart: unless-stopped

  # === HTTPS: внешний reverse-proxy с автоматическими сертификатами Let's Encrypt ===
  caddy:
    image: caddy:2-alpine
    container_name: storage_caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  # === Логи: сбор (promtail) + хранение (loki) + веб-интерфейс (grafana) ===

  loki:
    image: grafana/loki:3.6.11
    container_name: storage_loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      # API Loki (для LogQL-запросов извне при необходимости)
      - "${LOKI_PUBLISH_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.11
    container_name: storage_promtail
    command: -config.file=/etc/promtail/promtail.yml
    # Только чтение docker.sock: promtail следит за логами контейнеров.
    user: root
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.3
    container_name: storage_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Просмотр логов без логина (вкладка Explore); настройка — под админом.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PUBLISH_PORT:-3000}:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  promtail_positions:
  grafana_data:
  caddy_data:
  caddy_config: